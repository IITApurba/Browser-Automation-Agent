services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: browser_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: apps/dashboard
    ports:
      - "5173:5173"

volumes:
  postgres_data:
